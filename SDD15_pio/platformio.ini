; SmallDesktopDisplay V1.5 —— PlatformIO 工程
; 打开方式：VS Code 连接 WSL 后，用 "PlatformIO: Open Project" 或资源管理器打开本文件夹（SDD15_pio）
; 编译：侧边栏 PlatformIO 图标 → General → Build（或终端 pio run）
; 烧录：接线 USB 后 PlatformIO → Upload（WSL 识别串口的步骤见聊天回复说明）

[env:esp12e]
platform = espressif8266@2.6.3
board = esp12e
framework = arduino
monitor_speed = 115200
; 文件系统：天气图标与字库放在 LittleFS 里，改图/换字体只需重新上传文件系统，不用重编固件
; 打包：pio run -t buildfs ；上传：pio run -t uploadfs
board_build.filesystem = littlefs

; 固定使用 core 2.7.4：3.x 新核心的软件PWM受WiFi中断干扰，会导致背光只剩最高档附近才亮
; TFT 引脚以 libraries/TFT_eSPI/User_Setup.h 为准，与 board 定义无关

build_flags =
    -DARDUINOJSON_ENABLE_STD_STRING=1
    ; TJpg_Decoder 用 LittleFS（不定义则走 SPIFFS）
    -DUSE_LITTLEFS=1

; 本地库（libraries/TFT_eSPI 中 User_Setup.h 已配置 ST7789 240x240 与引脚）通过 lib/ 符号链接引入。
lib_deps =
    bblanchon/ArduinoJson@6.17.2
    ; Time 由 lib/Time 符号链接提供
    ; TJpg_Decoder 由 lib/TJpg_Decoder 符号链接提供（0.0.3，适配旧核心）

lib_compat_mode = strict
lib_ldf_mode = chain+
